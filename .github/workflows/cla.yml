name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# The action records signatures by committing to the signatures branch, and
# comments on and sets the status of the pull request.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # pull_request_target runs with write access, so this job must never
      # check out or run code from the pull request.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/citadel-ai-apps/citadel/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          # Kept off main so signing never needs to bypass branch protection.
          branch: cla-signatures
          allowlist: gherynos,Manfrini,dependabot[bot],renovate[bot]
