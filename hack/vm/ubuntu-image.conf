# The base image for the development VM, pinned.
#
# Pinned to a dated serial rather than to `release/`, which moves to each new
# point release: a base image that changes underneath you makes every result
# recorded before the change unreproducible. This is the same reason the
# hardened PocketBase image pins its binary by committed checksum.
#
# To move to a newer serial: pick one from
# https://cloud-images.ubuntu.com/releases/24.04/, take both checksums from its
# SHA256SUMS, update the three values below, and re-run the full suite —
# `make check` — before committing. Kernel behaviour is the thing being tested.

UBUNTU_RELEASE=24.04
UBUNTU_SERIAL=release-20260911

UBUNTU_SHA256_arm64=7b682958a67ff5de068e36de6af8b75fa645d296af5a70d6500527f6a33781db
UBUNTU_SHA256_amd64=612b2c0cc1bc413a6cb8c38fd611794caf0f2b436c50013d8b3794db12ad7354
